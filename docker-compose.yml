services:
  opentopomap-proxy:
    # Prefer GHCR on servers (Watchtower). Local: docker compose up --build
    image: ghcr.io/luen/opentopomapproxy:latest
    build: .
    container_name: opentopomap-proxy
    restart: always
    ports:
      - "8070:80"
    volumes:
      - ./data/cache:/data/opentopomap_proxy/cache
      - ./data/logs:/data/opentopomap_proxy/logs
