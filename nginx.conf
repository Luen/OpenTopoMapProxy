user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost:3000$" $http_origin;
        "~^https?://([a-zA-Z0-9-]+\.)*wanderstories\.space$" $http_origin;
    }

    proxy_cache_path /data/opentopomap_proxy/cache levels=1:2 keys_zone=opentopomap_proxy_cache:10m max_size=10g inactive=1M use_temp_path=off;

    upstream opentopomap_proxy_servers {
        server tile.opentopomap.org:443;
    }

    server {
        listen 80;

        server_name opentopomap.wanderstories.space;

        root /usr/share/nginx/html;
        index index.html;

        access_log off;
        error_log /data/opentopomap_proxy/logs/nginx-error.log;

        # Serve index.html for root path
        location = / {
            try_files /index.html =404;
        }

        # Serve index.html if accessed directly
        location = /index.html {
            try_files /index.html =404;
        }

        # Proxy all other requests (tile requests)
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Vary Origin always;
                return 204;
            }

            proxy_cache_key "$request_uri";

            proxy_cache opentopomap_proxy_cache;
            proxy_cache_lock on;
            proxy_cache_min_uses 1;

            proxy_ignore_headers Cache-Control expires;
            add_header Cache-Control public;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            add_header Vary Origin always;

            expires 1M;
            proxy_cache_valid 200 1M;

            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host tile.opentopomap.org;
            proxy_set_header User-Agent "Mozilla/5.0 (compatible; OpenTopoMap-Proxy/1.0)";
            proxy_redirect off;

            # Add these directives for retry logic
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_ssl_server_name on;
            proxy_ssl_name tile.opentopomap.org;
            proxy_pass https://opentopomap_proxy_servers;
        }
    }
}